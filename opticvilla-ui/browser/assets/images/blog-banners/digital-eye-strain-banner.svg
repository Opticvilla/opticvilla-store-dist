<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Digital Eye Strain Banner</title>
  <desc id="desc">High contrast modern banner with display and eye comfort motifs</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="980" y="170" width="460" height="290" rx="24" fill="#0b1220" stroke="#334155" stroke-width="3" />
  <rect x="1015" y="205" width="390" height="220" rx="14" fill="#0f172a" />
  <rect x="1145" y="448" width="140" height="16" rx="8" fill="#334155" />

  <circle cx="1180" cy="315" r="78" fill="none" stroke="url(#glow)" stroke-width="10" />
  <circle cx="1180" cy="315" r="38" fill="#22d3ee" opacity="0.35" filter="url(#softGlow)" />

  <g opacity="0.35" fill="none" stroke="#22d3ee" stroke-width="2">
    <path d="M0 140 H1600" />
    <path d="M0 760 H1600" />
    <path d="M180 0 V900" />
    <path d="M1420 0 V900" />
  </g>

  <g transform="translate(120 190)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#f8fafc" font-weight="700">Digital Eye Strain Guide</text>
    <text x="0" y="68" font-family="Verdana, Arial, sans-serif" font-size="30" fill="#cbd5e1">Blue Light, Screen Fatigue, and Daily Relief Habits</text>
    <rect x="0" y="108" width="560" height="10" rx="5" fill="url(#glow)" />
    <text x="0" y="180" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#93c5fd">Workstation setup</text>
    <text x="0" y="220" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#93c5fd">Blink strategy</text>
    <text x="0" y="260" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#93c5fd">Lens optimization</text>
  </g>
</svg>
