<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Optic Coins rewards and savings guide</title>
  <desc id="desc">OpticVilla eyeglasses beside stacked loyalty coins representing rewards on eyewear purchases</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f2c"/>
      <stop offset="0.58" stop-color="#17685f"/>
      <stop offset="1" stop-color="#63c8bd"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="0.52" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#071b19" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 690 C260 590 420 760 690 660 C960 560 1180 590 1600 430 V900 H0Z" fill="#f6f7f2" opacity="0.1"/>
  <circle cx="1420" cy="110" r="250" fill="none" stroke="#b9ffdc" stroke-width="2" opacity="0.22"/>
  <circle cx="1420" cy="110" r="190" fill="none" stroke="#b9ffdc" stroke-width="2" opacity="0.16"/>

  <g transform="translate(1050 475)" filter="url(#shadow)">
    <g fill="none" stroke="#f7f5ed" stroke-width="18" stroke-linecap="round">
      <rect x="-390" y="-130" width="280" height="205" rx="92"/>
      <rect x="35" y="-130" width="280" height="205" rx="92"/>
      <path d="M-110 -28 H35"/>
      <path d="M-390 -25 L-525 -80"/>
      <path d="M315 -25 L450 -80"/>
    </g>
    <g transform="translate(325 155)">
      <ellipse cx="0" cy="120" rx="128" ry="44" fill="#9a5806" opacity="0.55"/>
      <ellipse cx="0" cy="75" rx="128" ry="44" fill="url(#coin)" stroke="#ffe0a3" stroke-width="5"/>
      <ellipse cx="0" cy="15" rx="128" ry="44" fill="url(#coin)" stroke="#ffe0a3" stroke-width="5"/>
      <ellipse cx="0" cy="-45" rx="128" ry="44" fill="url(#coin)" stroke="#ffe0a3" stroke-width="5"/>
      <text x="0" y="-25" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#713f12">OV</text>
    </g>
  </g>

  <g transform="translate(120 170)">
    <text x="0" y="0" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="6" fill="#b9ffdc">OPTICVILLA REWARDS</text>
    <text x="0" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#f7f5ed">Save more with</text>
    <text x="0" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#f7f5ed">Optic Coins</text>
    <text x="0" y="270" font-family="Verdana, Arial, sans-serif" font-size="30" fill="#d8e7e3">Earn on eligible orders. Redeem on your next.</text>
    <rect x="0" y="315" width="410" height="8" rx="4" fill="#ff8066"/>
  </g>
</svg>
